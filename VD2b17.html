<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-element ::placeholder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff;
            padding: 20px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .section {
            background: #fff6cc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .code-box {
            background: #fff1b8;
            padding: 15px;
            border-radius: 10px;
            font-family: Consolas, monospace;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 16px;
        }

        .back {
            margin-top: 10px;
            padding: 10px 22px;
            background: #555;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <h2>Pseudo-element <code>::placeholder</code></h2>

    <div class="section">
        <div class="code-box">
            input::placeholder { <br>
            &nbsp;&nbsp;&nbsp;&nbsp;color: red; <br>
            &nbsp;&nbsp;&nbsp;&nbsp;font-style: italic; <br>
            }
        </div>

        <div class="desc">
            Định dạng chữ gợi ý trong ô nhập.
        </div>
    </div>

    <!-- Nút quay về -->
    <button class="back" onclick="location.href='Bai17.html'">Quay về</button>

</body>
</html>
