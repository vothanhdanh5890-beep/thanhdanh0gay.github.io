<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang Web Tin Học - Nhóm 2</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: url('https://github.com/vothanhdanh5890-beep/thanhdanh0gay.github.io/blob/main/xanh.jpg?raw=true') no-repeat center/cover;
        filter: brightness(0.8);
    }

    /* Hiệu ứng tuyết rơi */
    .snowflake {
        position: fixed;
        top: -10px;
        color: white;
        font-size: 1em;
        user-select: none;
        pointer-events: none;
        z-index: 9999;
        animation: fall linear infinite;
    }
    @keyframes fall {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
    }

    /* Banner */
    .banner {
        background: url('https://github.com/vothanhdanh5890-beep/thanhdanh0gay.github.io/blob/main/unnamed.jpg?raw=true') center/cover;
        height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    .banner img {
        width: 140px;
        filter: drop-shadow(0 0 10px white);
    }

    /* Nội dung chính */
    .main-box {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.3);
        width: 85%;
        margin: 20px auto;
        padding: 25px;
        border-radius: 15px;
        border: 2px solid rgba(255,255,255,0.6);
    }
    h1 {
        text-align: center;
        font-size: 32px;
        color: #fffacd; /* vàng trắng */
        margin-bottom: 10px;
        text-shadow: 0 0 8px #ffffff, 0 0 15px #ffea00; /* hiệu ứng glowy */
    }

    .members {
        margin-top: 20px;
    }
    .member-box {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.4);
        border: 2px solid #89CFF0;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 15px;
        transition: 0.3s;
    }
    .member-box:hover {
        background: rgba(255, 255, 255, 0.7);
        transform: scale(1.02);
    }
    .member-box img {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 3px solid white;
        margin-right: 15px;
    }
    .member-box a {
        font-size: 20px;
        text-decoration: none;
        color: #fffacd; /* vàng trắng */
        font-weight: bold;
        text-shadow: 0 0 6px #ffffff, 0 0 12px #ffea00; /* glowy */
    }

    /* Bài tập */
.exercise {
    background: rgba(255, 255, 255, 0.55);
    padding: 18px;
    margin: 12px 0;
    border-radius: 18px;
    text-align: center;
    font-size: 22px;
    cursor: pointer;
    border: 3px solid #ffb7dd; /* viền hồng nhạt hơi sến */
    color: #ffe6f2; /* chữ hồng sữa */
    font-weight: bold;
    text-shadow: 0 0 6px #ffcce6, 0 0 12px #ffffff;
    box-shadow: 0 0 12px rgba(255, 170, 200, 0.6);
    transition: 0.35s;
}

.exercise:hover {
    background: #fff0f6;
    transform: scale(1.05);
    box-shadow: 0 0 18px rgba(255, 150, 200, 0.9);
}
    /* Footer */
    footer {
        text-align: center;
        margin-top: 30px;
        padding: 15px;
        background: rgba(255,255,255,0.5);
        font-size: 18px;
        border-top: 2px solid #bcdfff;
    }
    footer img {
        width: 170px;
        margin-top: 10px;
        border-radius: 10px;
    }
    /* Glowy headings */
    h1, h2, h3 {
        color: #fff7b3;
        text-shadow: 0 0 8px #fff7b3, 0 0 16px #ffffff;
    }

    /* Softer yellow names */
    .member-card h3 {
        color: #f5e7a2;
        text-shadow: 0 0 4px #f5e7a2;
    }
</style>
</head>

<!-- Tạo hiệu ứng tuyết rơi -->
<script>
    function createSnow() {
        const snow = document.createElement('div');
        snow.classList.add('snowflake');
        snow.textContent = '❄';
        snow.style.left = Math.random() * window.innerWidth + 'px';
        snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
        snow.style.fontSize = (Math.random() * 10 + 10) + 'px';
        document.body.appendChild(snow);
        setTimeout(() => snow.remove(), 5000);
    }
    setInterval(createSnow, 150);
</script>
