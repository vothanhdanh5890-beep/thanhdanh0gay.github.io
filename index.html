<style>
/* ============================= */
/* THEME COLORS */
/* ============================= */
:root {
    --primary: #1B3B6F;
    --secondary: #FFC857;
    --accent: #4ABDAC;
    --bg: #F4F7FB;
    --text-dark: #0D1B2A;
    --card-radius: 20px;
    --shadow: 0 8px 25px rgba(0,0,0,0.15);
}

/* ============================= */
/* GLOBAL */
/* ============================= */
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    animation: fadein 0.8s ease;
}

@keyframes fadein {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ============================= */
/* NAVBAR */
/* ============================= */
nav {
    display: flex;
    justify-content: center;
    gap: 35px;
    padding: 16px 0;
    background: rgba(27, 59, 111, 0.9);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
}

nav a {
    color: var(--secondary);
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    transition: 0.25s;
}

nav a:hover {
    color: white;
    transform: translateY(-2px);
}

/* ============================= */
/* BANNER */
/* ============================= */
.banner {
    position: relative;
    width: 100%;
    height: 330px;
    background-image: url("https://github.com/vothanhdanh5890-beep/thanhdanh0gay.github.io/blob/main/unnamed.jpg?raw=true");
    background-size: cover;
    background-position: center;
}

.banner img.logo {
    width: 120px;
    position: absolute;
    bottom: 20px;
    left: 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
}

.banner span {
    position: absolute;
    bottom: 30px;
    left: 160px;
    font-size: 32px;
    font-weight: 700;
    color: white;
    text-shadow: 0 3px 6px rgba(0,0,0,0.4);
}

/* ============================= */
/* MEMBERS */
/* ============================= */
.members {
    display: flex;
    justify-content: center;
    gap: 45px;
    flex-wrap: wrap;
    padding: 40px 0;
}

.member {
    width: 180px;
    padding: 20px;
    background: white;
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    text-align: center;
    cursor: pointer;
    transition: 0.35s;
}

.member:hover {
    transform: translateY(-8px);
}

.member img {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 12px;
    border: 3px solid var(--accent);
}

.member h3 {
    margin-top: 8px;
    font-size: 19px;
    color: var(--primary);
    font-weight: 700;
}

/* ============================= */
/* EXERCISES */
/* ============================= */
.exercises {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    padding-bottom: 60px;
}

.exercise {
    width: 140px;
    height: 140px;
    border-radius: var(--card-radius);
    background: var(--secondary);
    color: var(--primary);
    font-size: 22px;
    font-weight: 700;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: var(--shadow);
    transition: 0.35s;
}

.exercise:hover {
    transform: translateY(-8px) rotate(-3deg);
    box-shadow: 0 14px 28px rgba(0,0,0,0.25);
}

/* ============================= */
/* FOOTER */
/* ============================= */
footer {
    text-align: center;
    padding: 18px;
    background: var(--primary);
    color: var(--secondary);
    font-size: 14px;
    letter-spacing: 0.4px;
}

/* ============================= */
/* MOBILE */
/* ============================= */
@media (max-width: 500px) {
    .banner { font-size: 26px; height: 260px; }
    .exercise { width: 110px; height: 110px; font-size: 18px; }
}
</style>
