<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giới thiệu bản thân - Phi Vũ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74b9ff, #a29bfe);
      margin: 0;
      padding: 0;
      color: #2d3436;
    }
    .container {
      max-width: 700px;
      margin: 50px auto;
      background: #ffffffcc;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #6c5ce7;
      margin-bottom: 20px;
    }
    h1 {
      color: #6c5ce7;
      margin-bottom: 10px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
    .box {
      background: #dfe6e9;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 17px;
    }
    /* Nút quay về */
    .back-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      font-size: 18px;
      color: #fff;
      background: #6c5ce7;
      border: none;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .back-btn:hover {
      background: #341f97;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="avatar 3.jpg" alt="Avatar" class="avatar" />

    <h1>Xin chào, mình là Phi Vũ!</h1>

    <p>Mình là một người thích sự thư giãn và luôn tìm kiếm những điều vui vẻ trong cuộc sống. Dưới đây là vài điều về mình:</p>

    <div class="box">
      <strong>Sở thích:</strong> Chơi game 🎮, nghe nhạc 🎵, ngủ 😴
    </div>

    <a href="index.html" class="back-btn">Quay về trang trước</a>
  </div>
</body>
</html>
