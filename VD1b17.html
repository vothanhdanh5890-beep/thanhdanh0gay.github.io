<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-class</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff;
            padding: 20px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .section {
            background: #fff6cc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .code-box {
            background: #fff1b8;
            padding: 15px;
            border-radius: 10px;
            font-family: Consolas, monospace;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 16px;
        }

        hr {
            border: none;
            border-top: 2px solid #ccc;
            margin: 30px 0;
        }

        .back {
            padding: 10px 22px;
            background: #555;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <h2>Pseudo-class <code>:visited</code></h2>
    <div class="section">
        <div class="code-box">
            a:visited { <br>
            &nbsp;&nbsp;&nbsp;&nbsp;color: gray; <br>
            }
        </div>
        <div class="desc">
            Áp dụng cho liên kết đã truy cập.
        </div>
    </div>

    <hr>

    <h2>Pseudo-class <code>:invalid</code></h2>
    <div class="section">
        <div class="code-box">
            input:invalid { <br>
            &nbsp;&nbsp;&nbsp;&nbsp;border: 2px solid red; <br>
            }
        </div>
        <div class="desc">
            Áp dụng cho ô nhập không hợp lệ.
        </div>
    </div>

    <!-- Nút quay về -->
    <button class="back" onclick="location.href='Bai17.html'">Quay về</button>

</body>
</html>
